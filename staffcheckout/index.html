                                border: `1px solid ${enabledModes.qr ? TEAL : '#3f4b5b'}`,
                                backgroundColor: enabledModes.qr ? 'rgba(0,140,149,0.18)' : '#2b3543',
                                color: enabledModes.qr ? '#e2e8f0' : '#94a3b8',
                                cursor: 'pointer', fontSize: '0.82rem',
                            }}>
                        <IconQR style={{ width: 14, height: 14 }} />
                        USEFULL QR
                        <Switch on={enabledModes.qr} />
                    </button>

                    {/* Address-only behaviour flag */}
                    {primary === 'address' && (
                        <button type="button" onClick={onTogglePrefilter}
                                className="font-body"
                                title="Only offer streets that actually contain the unit number entered"
                                style={{
                                    display: 'flex', alignItems: 'center', gap: 8,
                                    padding: '6px 10px', borderRadius: 8,
                                    border: `1px solid ${prefilterStreets ? TEAL : '#3f4b5b'}`,
                                    backgroundColor: prefilterStreets ? 'rgba(0,140,149,0.18)' : '#2b3543',
                                    color: prefilterStreets ? '#e2e8f0' : '#94a3b8',
                                    cursor: 'pointer', fontSize: '0.82rem',
                                }}>
                            Prefilter streets
                            <Switch on={prefilterStreets} />
                        </button>
                    )}

                    {/* How to resolve a unit that exists in several wings */}
                    {primary === 'address' && (
                        <button type="button" onClick={onToggleAlphaUnits}
                                className="font-body"
                                title={alphaUnits
                                    ? 'Type the wing letter with the unit, e.g. 101N'
                                    : 'Pick the wing from a list after choosing the street'}
                                style={{
                                    display: 'flex', alignItems: 'center', gap: 8,
                                    padding: '6px 10px', borderRadius: 8,
                                    border: `1px solid ${alphaUnits ? TEAL : '#3f4b5b'}`,
                                    backgroundColor: alphaUnits ? 'rgba(0,140,149,0.18)' : '#2b3543',
                                    color: alphaUnits ? '#e2e8f0' : '#94a3b8',
                                    cursor: 'pointer', fontSize: '0.82rem',
                                }}>
                            {alphaUnits ? 'Alphanumeric units' : 'Wing disambiguation'}
                            <Switch on={alphaUnits} />
                        </button>
                    )}

                    {/* Test entries — contextual to the selected venue */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                        <Label>Try</Label>
                        {primary === 'orderId' && (<>
                            {Object.entries(MOCK_ORDERS).map(([code, order]) => (
                                <Chip key={code} onClick={() => onFillOrder(code)} title={order.name}>#{code}</Chip>
                            ))}
                            <Chip tone="miss" onClick={() => onFillOrder('0000')} title="Order not found">#0000 · none</Chip>
                        </>)}
                        {primary === 'lastFour' && (<>
                            {Object.entries(MOCK_STUDENTS).map(([code, list]) => (
                                <Chip key={code} onClick={() => onFillCard(code)}
                                      title={list.map(s => s.name).join(', ')}>
                                    {code}{list.length > 1 ? ` · ${list.length}` : ''}
                                </Chip>
                            ))}
                            <Chip tone="miss" onClick={() => onFillCard('9999')} title="No matching account">9999 · none</Chip>
                        </>)}
                        {primary === 'address' && (<>
                            {MOCK_ADDRESSES.map(a => {
                                const b = BUILDINGS.find(x => x.key === a.key);
                                return (
                                    <Chip key={`${a.key}-${a.unit}`}
                                          onClick={() => onFillAddress(a.unit, a.key)}
                                          title={`Valid address — ${formatAddress(b, a.unit)}`}>
                                        {formatAddress(b, a.unit)}
                                    </Chip>
                                );
                            })}
                            <Chip tone="miss"
                                  onClick={() => onFillAddress(MOCK_ADDRESS_MISS.unit, MOCK_ADDRESS_MISS.key)}
                                  title="No resident registered at this unit">
                                {MOCK_ADDRESS_MISS.unit} · none
                            </Chip>
                        </>)}
                    </div>

                    {/* Simulate a container scan (no camera in a demo browser) */}
                    <button type="button" onClick={onSimulateScan} disabled={!scanEnabled}
                            className="font-body"
                            title={scanEnabled ? 'Simulate scanning a container' : 'Available once a checkout is in progress'}
                            style={{
                                marginLeft: 'auto',
                                display: 'flex', alignItems: 'center', gap: 8,
                                padding: '6px 12px', borderRadius: 8,
                                border: '1px solid #3f4b5b', backgroundColor: '#2b3543',
                                color: scanEnabled ? '#e2e8f0' : '#64748b',
                                cursor: scanEnabled ? 'pointer' : 'not-allowed',
                                opacity: scanEnabled ? 1 : 0.55, fontSize: '0.82rem',
                            }}>
                        <IconCup style={{ width: 14, height: 14 }} />
                        Scan container
                    </button>
                </div>
            );
        };

        // ============================================================
        // MAIN APP
        // ============================================================
        const App = () => {
            // Which lookup modes are available (configurable in settings, or via URL). Default: Order ID only.
            const [enabledModes, setEnabledModes]   = useState(() => parseModeConfig().enabled);

            // Flow state
            const [mode, setMode]                   = useState(() => parseModeConfig().active); // 'orderId' | 'lastFour' | 'address' | 'qr'
            const [phase, setPhase]                 = useState('lookup');    // 'lookup' | 'selectName' | 'noAccount' | 'noOrder' | 'selectAddress' | 'noAddress' | 'scanning' | 'success'
            const [digits, setDigits]               = useState('');
            const [matches, setMatches]             = useState([]);
            const [cardEnd, setCardEnd]             = useState('');          // last 4 used for current lookup (display)
            const [selectedUser, setSelectedUser]   = useState(null);
            const [orderNum, setOrderNum]           = useState('');
            const [selectedBuilding, setSelectedBuilding] = useState(null);  // { name, prefix } for Address mode
            const [addressLabel, setAddressLabel]   = useState('');          // e.g. "Canyonview C150"

            // Container scan state
            const [items, setItems]                 = useState([]);
            const [error, setError]                 = useState(null);
            const [timeLeft, setTimeLeft]           = useState(60);
            const [successData, setSuccessData]     = useState(null);
            const [justScanned, setJustScanned]     = useState(false);

            // Misc UI state
            const [showAccessModal, setShowAccessModal]     = useState(false);
            const [isPortrait, setIsPortrait]               = useState(() => window.innerHeight > window.innerWidth);

            // Address lookup reads like a written address: unit number, then street.
            const [addressStep, setAddressStep]             = useState('unit'); // 'unit' | 'street'
            // When on, the street list is narrowed to streets that actually have
            // that unit number. Off by default — staff usually know the street.
            const [prefilterStreets, setPrefilterStreets]   = useState(false);
            // How to resolve a unit number that exists in several wings of one
            // street (Garden Terrace 101 South/North/West):
            //   off (default) → pick the wing from a list after choosing the street
            //   on            → type the wing letter directly, e.g. "101N"
            const [alphaUnits, setAlphaUnits]               = useState(false);

            // Sound prefs
            const [containerSuccessSound, setContainerSuccessSound] = useState('successful-scan');
            const [finalSuccessSound, setFinalSuccessSound]         = useState('final-success-chime-1');
            const [errorSound, setErrorSound]                       = useState('error');

            const scannedCodesRef = useRef(new Set());
            const audioCtxRef     = useRef(null);
            const soundBuffersRef = useRef({});

            // Refs mirroring state for use inside stable callbacks
            const modeRef            = useRef(mode);            modeRef.current = mode;
            const enabledModesRef    = useRef(enabledModes);    enabledModesRef.current = enabledModes;
            const selectedBuildingRef = useRef(selectedBuilding); selectedBuildingRef.current = selectedBuilding;
            const digitsRef           = useRef(digits);          digitsRef.current = digits;

            // Senior living has residents, campuses have students. Derived from the
            // venue rather than the active view, because USEFULL QR is an add-on
            // that can sit on top of any venue.
            const personNoun = primaryOf(enabledModes) === 'address' ? 'resident' : 'student';

            // Order ID / Last 4 are fixed-width; unit numbers are freeform.
            const FIXED_LEN = 4;
            const MAX_UNIT_LEN = 6;
            const isAddress = mode === 'address';

            // Orientation
            useEffect(() => {
                const mq = window.matchMedia('(orientation: portrait)');
                const handler = (e) => setIsPortrait(e.matches);
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);

            // Live-apply URL mode config when the hash changes (handy for demos)
            useEffect(() => {
                const onHash = () => {
                    const cfg = parseModeConfig();
                    setEnabledModes(cfg.enabled);
                    if (phase === 'lookup') {
                        setMode(cfg.active);
                        setDigits('');
                        setMatches([]);
                        setCardEnd('');
                        setSelectedBuilding(null);
                        setAddressStep('unit');
                    }
                };
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, [phase]);

            // Audio unlock
            useEffect(() => {
                const unlock = async () => {
                    if (audioCtxRef.current) return;
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    audioCtxRef.current = ctx;
                    try {
                        await Promise.all(SOUND_OPTIONS.map(async ({ value, path }) => {
                            const res = await fetch(path);
                            if (!res.ok) throw new Error(`Failed to load ${path}`);
                            const buf = await res.arrayBuffer();
                            soundBuffersRef.current[value] = await ctx.decodeAudioData(buf);
                        }));
                    } catch (_) {}
                };
                document.addEventListener('touchstart', unlock, { once: true });
                document.addEventListener('click',      unlock, { once: true });
                return () => {
                    document.removeEventListener('touchstart', unlock);
                    document.removeEventListener('click',      unlock);
                };
            }, []);

            const playSound = useCallback((soundKey) => {
                const ctx = audioCtxRef.current;
                const buffer = soundBuffersRef.current[soundKey];
                if (!ctx || !buffer) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                src.connect(ctx.destination);
                src.start(0);
            }, []);

            // Reset to start
            const resetAll = useCallback(() => {
                setMode(firstEnabledMode(enabledModesRef.current));
                setPhase('lookup');
                setDigits('');
                setMatches([]);
                setCardEnd('');
                setSelectedUser(null);
                setOrderNum('');
                setSelectedBuilding(null);
                setAddressStep('unit');
                setAddressLabel('');
                setItems([]);
                setError(null);
                setTimeLeft(60);
                setSuccessData(null);
                setJustScanned(false);
                scannedCodesRef.current.clear();
            }, []);

            // Cancel current student (drop scans + go back to lookup)
            const handleCancelStudent = useCallback(() => {
                setItems([]);
                setSelectedUser(null);
                setDigits('');
                setMatches([]);
                setCardEnd('');
                setOrderNum('');
                setSelectedBuilding(null);
                setAddressStep('unit');
                setAddressLabel('');
                setError(null);
                setTimeLeft(60);
                setJustScanned(false);
                setPhase('lookup');
                scannedCodesRef.current.clear();
            }, []);

            // Lookup a 4-digit card/order number.
            // Address mode does NOT come through here — it resolves on street
            // selection (see resolveAddress), because the unit number is entered
            // first and is freeform, so there is no digit count to trigger on.
            const performLookup = useCallback((code, modeHint) => {
                const effectiveMode = modeHint ?? mode;
                if (effectiveMode === 'orderId') {
                    const order = MOCK_ORDERS[code];
                    setOrderNum(code);
                    setCardEnd(code);
                    if (!order) {
                        playSound(errorSound);
                        setPhase('noOrder');
                    } else {
                        setMatches([{ name: order.name, cardEnd: code }]);
                        setPhase('selectName');
                    }
                    return;
                }
                const results = MOCK_STUDENTS[code] || [];
                setMatches(results);
                setCardEnd(code);
                if (results.length === 0) {
                    playSound(errorSound);
                    setPhase('noAccount');
                } else {
                    setPhase('selectName');
                }
            }, [mode, errorSound, playSound]);

            // Keypad handlers
            const handleDigit = useCallback((d) => {
                const address = modeRef.current === 'address';
                setDigits(prev => {
                    // Unit numbers vary in length, so address entry never
                    // auto-submits — staff confirm with Continue.
                    if (address) {
                        const isLetter = /[A-Za-z]/.test(d);
                        // A wing letter only ever trails the number, and only one.
                        if (isLetter) {
                            if (!prev || wingPart(prev)) return prev;
                            return prev + d.toUpperCase();
                        }
                        if (wingPart(prev)) return prev;   // number can't follow a wing
                        return prev.length >= MAX_UNIT_LEN ? prev : prev + d;
                    }
                    if (prev.length >= FIXED_LEN) return prev;
                    const next = prev + d;
                    if (next.length === FIXED_LEN) {
                        // defer lookup so the last digit is visible first
                        setTimeout(() => performLookup(next), 180);
                    }
                    return next;
                });
            }, [performLookup]);

            const handleBackspace = useCallback(() => {
                setDigits(prev => prev.slice(0, -1));
            }, []);

            const handleFillCard = useCallback((code) => {
                setMode('lastFour');
                setDigits(code);
                setTimeout(() => performLookup(code, 'lastFour'), 180);
            }, [performLookup]);

            const handleFillOrder = useCallback((code) => {
                setMode('orderId');
                setDigits(code);
                setTimeout(() => performLookup(code, 'orderId'), 180);
            }, [performLookup]);

            // Confirm a student (from name select modal)
            const handleSelectStudent = useCallback((student) => {
                setSelectedUser(student);
                setPhase('scanning');
                setItems([]);
                setTimeLeft(60);
                scannedCodesRef.current.clear();
            }, []);

            // No-account: switch to QR mode for this student
            const handleSwitchToQRFromNoAccount = useCallback(() => {
                setMode('qr');
                setPhase('lookup');
                setDigits('');
                setMatches([]);
                setCardEnd('');
            }, []);

            const handleTryAgain = useCallback(() => {
                setPhase('lookup');
                setDigits('');
                setMatches([]);
                setCardEnd('');
                setOrderNum('');
            }, []);

            // ── Address: unit number first, then street (reads like an address) ──
            const startAddressCheckout = useCallback((name) => {
                setSelectedUser({ name });
                setItems([]);
                setTimeLeft(60);
                scannedCodesRef.current.clear();
                setPhase('scanning');
            }, []);

            // Resolve once both halves are known. Unlike the fixed-width lookups
            // this fires on street selection, not on a digit count.
            const resolveAddress = useCallback((building, unit) => {
                const found = resolveAddressMatches(building, unit);
                if (found.length === 0) {
                    playSound(errorSound);
                    setAddressLabel(formatAddress(building, unit));
                    setPhase('noAddress');
                } else if (found.length === 1) {
                    // Unambiguous — unit and street are both already on screen,
                    // so skip the confirm modal and go straight to scanning.
                    startAddressCheckout(found[0].name);
                } else {
                    // One number covering several units — disambiguate.
                    setMatches(found);
                    setPhase('selectAddress');
                }
            }, [errorSound, playSound, startAddressCheckout]);

            const handleAddressContinue = useCallback(() => {
                if (!digitsRef.current) return;
                setAddressStep('street');
            }, []);

            const handleSelectBuilding = useCallback((b) => {
                setSelectedBuilding(b);
                resolveAddress(b, digitsRef.current);
            }, [resolveAddress]);

            // Back to unit entry (from the street step or the chip on it)
            const handleEditUnit = useCallback(() => {
                setSelectedBuilding(null);
                setAddressStep('unit');
            }, []);

            const handleAddressTryAgain = useCallback(() => {
                setSelectedBuilding(null);
                setAddressStep('unit');
                setDigits('');
                setPhase('lookup');
            }, []);

            const handleSelectAddress = useCallback((item) => {
                startAddressCheckout(item.name);
            }, [startAddressCheckout]);

            // Demo shortcut: jump straight to a known-good (or known-bad) address
            const handleFillAddress = useCallback((unit, buildingKey) => {
                const b = BUILDINGS.find(x => x.key === buildingKey);
                if (!b) return;
                setMode('address');
                setDigits(unit);
                setAddressStep('street');
                setSelectedBuilding(b);
                setTimeout(() => resolveAddress(b, unit), 180);
            }, [resolveAddress]);

            // ── Demo-bar controls ────────────────────────────────────────
            const clearLookupState = useCallback(() => {
                setDigits('');
                setMatches([]);
                setCardEnd('');
                setOrderNum('');
                setSelectedBuilding(null);
                setAddressStep('unit');
                setPhase('lookup');
            }, []);

            // Keep the address bar in step with the demo bar, so whatever a
            // stakeholder is looking at is also what they get if they copy the
            // URL. (Sending a link that opened on the wrong venue is exactly how
            // this got confusing the first time round.) replaceState avoids
            // firing the hashchange listener below.
            const syncUrlToModes = useCallback((next) => {
                try {
                    const alias = { orderId: 'order', lastFour: 'last4', address: 'address' };
                    const list = [alias[primaryOf(next)]];
                    if (next.qr) list.push('qr');
                    window.history.replaceState(null, '', `${window.location.pathname}?modes=${list.join(',')}`);
                } catch (_) {}
            }, []);

            // Venues are mutually exclusive: picking one replaces the other two.
            // The USEFULL QR add-on is preserved across venue switches.
            const handleSetPrimary = useCallback((value) => {
                setEnabledModes(prev => {
                    const next = { orderId: false, lastFour: false, address: false, qr: prev.qr };
                    next[value] = true;
                    syncUrlToModes(next);
                    return next;
                });
                setMode(value);
                clearLookupState();
            }, [clearLookupState, syncUrlToModes]);

            const handleToggleQr = useCallback(() => {
                setEnabledModes(prev => {
                    const next = { ...prev, qr: !prev.qr };
                    // Turning QR off while it is the active view falls back to the venue
                    setMode(cur => (cur === 'qr' && !next.qr ? primaryOf(next) : cur));
                    syncUrlToModes(next);
                    return next;
                });
                clearLookupState();
            }, [clearLookupState, syncUrlToModes]);

            const handleTogglePrefilter = useCallback(() => {
                setPrefilterStreets(v => !v);
            }, []);

            const handleToggleAlphaUnits = useCallback(() => {
                setAlphaUnits(v => !v);
                setDigits('');          // a half-typed unit may not be valid in the other mode
                setSelectedBuilding(null);
                setAddressStep('unit');
            }, []);

            // Container scan
            const handleScanContainer = useCallback(() => {
                playSound(containerSuccessSound);
                setTimeLeft(60);
                setItems(prev => [...prev, { id: Date.now() }]);
                setError(null);
                setJustScanned(true);
                setTimeout(() => setJustScanned(false), 1500);
            }, [containerSuccessSound, playSound]);

            // Mock cup scan trigger (footer button) — only meaningful while scanning
            const handleMockCupScan = useCallback(() => {
                if (phase !== 'scanning') return;
                handleScanContainer();
            }, [phase, handleScanContainer]);

            // Done = finalize checkout
            const handleDone = useCallback(() => {
                if (items.length === 0 || !selectedUser) {
                    playSound(errorSound);
                    setError('Scan at least one container before tapping Done.');
                    setTimeout(() => setError(null), 3000);
                    return;
                }
                playSound(finalSuccessSound);
                const outcome = { kind: 'success', user: selectedUser.name, count: items.length };
                setSuccessData(outcome);
                setPhase('success');
                setTimeout(() => resetAll(), 6000);
            }, [errorSound, finalSuccessSound, items.length, playSound, resetAll, selectedUser]);

            // QR results
            const handleQRResult = useCallback((decoded) => {
                if (scannedCodesRef.current.has(decoded)) return;
                scannedCodesRef.current.add(decoded);

                if (phase === 'lookup' && mode === 'qr') {
                    if (decoded.startsWith('user')) {
                        // Authenticate via QR — mock student
                        const user = { name: 'Lillian Lyons', cardEnd: '••••' };
                        setSelectedUser(user);
                        setItems([]);
                        setTimeLeft(60);
                        scannedCodesRef.current.clear();
                        setPhase('scanning');
                    } else {
                        playSound(errorSound);
                        setError('Scan a USEFULL ID QR code (starts with "user").');
                        setTimeout(() => setError(null), 5000);
                    }
                    return;
                }

                if (phase === 'scanning') {
                    if (decoded.startsWith('cup')) {
                        handleScanContainer();
                    } else if (decoded.startsWith('user')) {
                        playSound(errorSound);
                        setError('Already authenticated — scan containers now.');
                        setTimeout(() => setError(null), 3000);
                    } else {
                        playSound(errorSound);
                        setError('Unrecognized QR code');
                        setTimeout(() => setError(null), 5000);
                    }
                    return;
                }
            }, [phase, mode, errorSound, handleScanContainer, playSound]);

            // Inactivity timeout while scanning containers
            useEffect(() => {
                if (phase !== 'scanning') { setTimeLeft(60); return; }
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { handleCancelStudent(); return 60; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [phase, handleCancelStudent]);

            // Mode toggle: clear in-progress lookup
            const handleModeChange = useCallback((next) => {
                if (phase !== 'lookup') return; // only switchable while looking up
                setMode(next);
                setDigits('');
                setMatches([]);
                setCardEnd('');
                setSelectedBuilding(null);
                setAddressStep('unit');
            }, [phase]);

            // Camera should run when in QR-lookup mode OR while scanning containers
            const cameraActive = (phase === 'lookup' && mode === 'qr') || phase === 'scanning';

            // Physical keyboard input — useful for demos
            useEffect(() => {
                const typingMode = mode === 'lastFour' || mode === 'orderId'
                    || (mode === 'address' && addressStep === 'unit');
                if (phase !== 'lookup' || !typingMode) return;
                const onKey = (e) => {
                    if (e.metaKey || e.ctrlKey || e.altKey) return;
                    if (showAccessModal) return;
                    if (e.key === 'Enter' && mode === 'address') {
                        e.preventDefault();
                        handleAddressContinue();
                        return;
                    }
                    // Wing letters are typeable too when alphanumeric entry is on
                    if (alphaUnits && mode === 'address'
                        && /^[A-Za-z]$/.test(e.key)
                        && WING_LETTERS.includes(e.key.toUpperCase())) {
                        e.preventDefault();
                        handleDigit(e.key);
                        return;
                    }
                    if (/^[0-9]$/.test(e.key)) {
                        e.preventDefault();
                        handleDigit(e.key);
                    } else if (e.key === 'Backspace' || e.key === 'Delete') {
                        e.preventDefault();
                        handleBackspace();
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [phase, mode, addressStep, alphaUnits, showAccessModal, handleDigit, handleBackspace, handleAddressContinue]);

            // ========================================================
            // RENDER
            // ========================================================
            // Address is a two-step flow: unit number, then street.
            const showAddressUnit   = phase === 'lookup' && isAddress && addressStep === 'unit';
            const showAddressStreet = phase === 'lookup' && isAddress && addressStep === 'street';
            const showKeypad   = phase === 'lookup' && (mode === 'lastFour' || mode === 'orderId');
            const showQRLookup = phase === 'lookup' && mode === 'qr';
            const showScanning = phase === 'scanning';

            // With prefiltering on, only offer streets that have this unit number.
            const streetOptions = (showAddressStreet && prefilterStreets && digits)
                ? buildingsWithUnit(digits)
                : BUILDINGS;

            return (
                <div className="h-full w-full flex flex-col overflow-hidden select-none"
                     style={{ backgroundColor: '#1b2330' }}>

                {/* Scaffolding — sits outside the kiosk frame on purpose */}
                <DemoBar
                    enabledModes={enabledModes}
                    onSetPrimary={handleSetPrimary}
                    onToggleQr={handleToggleQr}
                    prefilterStreets={prefilterStreets}
                    onTogglePrefilter={handleTogglePrefilter}
                    alphaUnits={alphaUnits}
                    onToggleAlphaUnits={handleToggleAlphaUnits}
                    onFillCard={handleFillCard}
                    onFillOrder={handleFillOrder}
                    onFillAddress={handleFillAddress}
                    onSimulateScan={handleMockCupScan}
                    scanEnabled={phase === 'scanning'}
                />

                <div className="flex-1 w-full flex flex-col overflow-hidden select-none relative"
                     style={{
                         backgroundColor: '#EEF2F3',
                         padding: isPortrait ? '14px 16px 10px' : '18px 22px 14px',
                         gap: isPortrait ? 12 : 16,
                         minHeight: 0,
                     }}>

                    {/* HEADER */}
                    <div style={{
                        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                        gap: 16, width: '100%',
                    }}>
                        <div className="flex flex-col items-start">
                            <UsefullLogo style={{ height: isPortrait ? '2.6rem' : '3.2rem' }} className="w-auto" />
                            <p className="font-display font-bold uppercase tracking-[0.2em]"
                               style={{ color: TEAL, fontSize: isPortrait ? '0.75rem' : '0.85rem',
                                        marginTop: '-0.5rem', paddingLeft: '0.78rem' }}>
                                Staff Checkout
                            </p>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 12 }}>
                            {phase === 'lookup' && (
                                <ModeToggle mode={mode} onChange={handleModeChange} enabledModes={enabledModes} />
                            )}
                            {phase === 'scanning' && selectedUser && (
                                <StudentBanner name={selectedUser.name} />
                            )}
                        </div>
                    </div>

                    {/* BODY — single persistent container; sub-views toggle visibility */}
                    <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>

                        {/* ADDRESS STEP 1 — UNIT NUMBER (freeform) */}
                        <div style={{
                            position: 'absolute', inset: 0,
                            display: showAddressUnit ? 'flex' : 'none',
                            flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center',
                            gap: isPortrait ? 16 : 20,
                            padding: isPortrait ? '8px 0' : '4px 0',
                        }}>
                            <div className="text-center" style={{ padding: '0 12px' }}>
                                <h1 className="font-display font-extrabold leading-tight"
                                    style={{ color: TEAL, fontSize: isPortrait ? '2.2rem' : '2.6rem' }}>
                                    Look Up Address
                                </h1>
                            </div>
                            <FreeformDisplay digits={digits} />
                            <NumericKeypad
                                onDigit={handleDigit}
                                onBackspace={handleBackspace}
                                disabled={digits.length >= MAX_UNIT_LEN}
                                onSubmit={handleAddressContinue}
                                submitLabel="Continue"
                                submitDisabled={digits.length === 0}
                                letters={alphaUnits ? WING_LETTERS : null}
                            />
                        </div>

                        {/* ADDRESS STEP 2 — STREET */}
                        <div style={{
                            position: 'absolute', inset: 0,
                            display: showAddressStreet ? 'flex' : 'none',
                            flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center',
                            gap: isPortrait ? 20 : 26,
                            padding: isPortrait ? '8px 0' : '4px 0',
                        }}>
                            <div className="text-center" style={{ padding: '0 12px' }}>
                                <h1 className="font-display font-extrabold leading-tight"
                                    style={{ color: TEAL, fontSize: isPortrait ? '2.2rem' : '2.6rem' }}>
                                    Look Up Address
                                </h1>
                            </div>

                            {/* The number already entered, tap to correct it */}
                            <button
                                onClick={handleEditUnit}
                                className="font-display font-bold name-pick"
                                style={{
                                    display: 'inline-flex', alignItems: 'center', gap: 10,
                                    padding: '10px 18px',
                                    borderRadius: 999,
                                    border: `1.5px solid ${TEAL}33`,
                                    background: TEAL_LIGHT,
                                    color: TEAL, fontSize: '1.35rem', cursor: 'pointer',
                                }}
                                title="Change the unit number"
                            >
                                {digits}
                                <IconX style={{ width: 12, height: 12 }} strokeWidth="2.5" />
                            </button>

                            {streetOptions.length === 0 ? (
                                <div className="text-center font-body"
                                     style={{ color: '#6B7280', fontSize: '1.1rem', maxWidth: 420, padding: '0 16px' }}>
                                    No street has unit {digits}. Tap the number above to change it.
                                </div>
                            ) : (
                                <div style={{
                                    display: 'flex', flexWrap: 'wrap', gap: 14,
                                    justifyContent: 'center', maxWidth: 760, padding: '0 12px',
                                }}>
                                    {streetOptions.map(b => (
                                        <button
                                            key={b.name}
                                            onClick={() => handleSelectBuilding(b)}
                                            className="font-display font-bold name-pick"
                                            style={{
                                                display: 'flex', alignItems: 'center', gap: 12,
                                                padding: '20px 28px',
                                                borderRadius: 16,
                                                border: '1.5px solid #e2e8f0',
                                                backgroundColor: '#fff',
                                                color: '#1e293b',
                                                fontSize: '1.5rem',
                                                cursor: 'pointer',
                                                boxShadow: '0 2px 8px rgba(15,23,42,0.05)',
                                                transition: 'border-color 0.15s ease, background-color 0.15s ease, transform 0.08s ease',
                                            }}
                                        >
                                            <IconBuilding style={{ width: 26, height: 26, color: TEAL }} />
                                            {b.name}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* KEYPAD VIEW */}
                        <div style={{
                            position: 'absolute', inset: 0,
                            display: showKeypad ? 'flex' : 'none',
                            flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center',
                            gap: isPortrait ? 18 : 22,
                            padding: isPortrait ? '8px 0' : '4px 0',
                        }}>
                            <div className="text-center" style={{ padding: '0 12px' }}>
                                <h1 className="font-display font-extrabold leading-tight"
                                    style={{ color: TEAL, fontSize: isPortrait ? '2.2rem' : '2.6rem' }}>
                                    {mode === 'orderId' ? 'Look up order' : 'Look up student'}
                                </h1>
                                <p className="font-body mt-1.5"
                                   style={{ color: '#6B7280', fontSize: isPortrait ? '1rem' : '1.15rem' }}>
                                    {mode === 'orderId'
                                        ? 'Enter the 4-digit order number from the receipt'
                                        : 'Enter the last 4 digits of the campus card from the receipt'}
                                </p>
                            </div>
                            <DigitDisplay digits={digits} length={FIXED_LEN} />
                            <NumericKeypad
                                onDigit={handleDigit}
                                onBackspace={handleBackspace}
                                disabled={digits.length >= FIXED_LEN}
                            />
                        </div>

                        {/* CAMERA VIEW — persistent for both QR-lookup and container-scanning */}
                        <div style={{
                            position: 'absolute', inset: 0,
                            display: (showQRLookup || showScanning) ? 'flex' : 'none',
                            flexDirection: isPortrait ? 'column' : 'row',
                            gap: 20,
                            alignItems: 'stretch',
                        }}>
                            <div style={{
                                flex: isPortrait ? '0 0 60%' : '0 0 60%',
                                minHeight: isPortrait ? 220 : 'auto',
                                position: 'relative',
                            }}>
                                <CameraBox
                                    isScanning={cameraActive}
                                    onQRResult={handleQRResult}
                                    isPortrait={false}
                                    borderRadiusOverride="20px"
                                />
                                <ErrorToast message={error} />
                            </div>

                            {/* Right side prompt — content swaps based on phase */}
                            {showQRLookup && (
                                <div style={{
                                    flex: 1,
                                    display: 'flex', flexDirection: 'column',
                                    alignItems: 'center', justifyContent: 'center',
                                    textAlign: 'center', padding: '12px', gap: 12,
                                }}>
                                    <div style={{
                                        width: 64, height: 64, borderRadius: 18,
                                        background: TEAL_LIGHT,
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        color: TEAL,
                                    }}>
                                        <IconQR style={{ width: 32, height: 32 }} />
                                    </div>
                                    <h1 className="font-display font-extrabold leading-tight"
                                        style={{ color: TEAL, fontSize: isPortrait ? '1.85rem' : '2.4rem' }}>
                                        Scan the {personNoun}'s<br/>USEFULL QR
                                    </h1>
                                    <p className="font-body"
                                       style={{ color: '#6B7280', fontSize: isPortrait ? '1rem' : '1.1rem', maxWidth: 360 }}>
                                        Have them open the USEFULL app and hold their QR code in front of the camera.
                                    </p>
                                </div>
                            )}

                            {showScanning && (
                                <div style={{
                                    flex: 1,
                                    display: 'flex', flexDirection: 'column',
                                    alignItems: 'center', justifyContent: 'center',
                                    gap: 16, padding: '8px', textAlign: 'center',
                                }}>
                                    <div>
                                        <h1 className="font-display font-extrabold leading-tight"
                                            style={{ color: TEAL, fontSize: isPortrait ? '2.1rem' : '2.6rem' }}>
                                            Scan user containers
                                        </h1>
                                        <p className="font-body mt-2"
                                           style={{ color: '#6B7280', fontSize: isPortrait ? '1.05rem' : '1.2rem' }}>
                                            Hold each USEFULL container in front of the camera, then tap Done.
                                        </p>
                                    </div>
                                    <div style={{ width: '100%', maxWidth: 340, display: 'flex', flexDirection: 'column', gap: 14 }}>
                                        <CountCard count={items.length} justScanned={justScanned} />
                                        <DoneButton count={items.length} onClick={handleDone} />
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>

                    {/* FOOTER */}
                    <div className="shrink-0 flex items-center gap-3"
                         style={{ borderTop: '1px solid rgba(0,140,149,0.12)', paddingTop: 12 }}>
                        <CloseButton onPress={() => setShowAccessModal(true)} />

                        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 12 }}>
                            {phase === 'scanning' && (
                                <CircularCancelButton timeLeft={timeLeft} total={60} onCancel={handleCancelStudent} />
                            )}
                        </div>
                    </div>

                    {/* MODALS */}
                    <AccessCodeModal isOpen={showAccessModal} onClose={() => { resetAll(); setShowAccessModal(false); }} />
                    {phase === 'selectName' && (
                        <NameSelectModal
                            matches={matches}
                            cardEnd={cardEnd}
                            onSelect={handleSelectStudent}
                            onCancel={handleTryAgain}
                            contextLabel={mode === 'orderId'
                                ? <span>Order <span className="font-bold" style={{ color: '#1e293b' }}>#{orderNum}</span></span>
                                : null}
                        />
                    )}
                    {phase === 'selectAddress' && (
                        <NameSelectModal
                            matches={matches}
                            title="Select the unit"
                            hideSubtitle
                            onSelect={handleSelectAddress}
                            onCancel={handleCancelStudent}
                        />
                    )}
                    {phase === 'noAddress' && (
                        <AddressNotFoundModal
                            addressLabel={addressLabel}
                            onTryAgain={handleAddressTryAgain}
                        />
                    )}
                    {phase === 'noOrder' && (
                        <OrderNotFoundModal
                            orderNum={orderNum}
                            onTryAgain={handleTryAgain}
                        />
                    )}
                    {phase === 'noAccount' && (
                        <NoAccountModal
                            cardEnd={cardEnd}
                            onTryAgain={handleTryAgain}
                            onSwitchToQR={handleSwitchToQRFromNoAccount}
                        />
                    )}
                    <OutcomeModal data={phase === 'success' ? successData : null} onDone={resetAll} personNoun={personNoun} />
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
