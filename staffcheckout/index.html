<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USEFULL Checkout Kiosk — Staff Checkout</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="USEFULL Staff">
    <link rel="apple-touch-icon" href="../images/USEFULL-Icon-Registered_Color.svg">
    <link rel="icon" type="image/svg+xml" href="../images/USEFULL-Icon-Registered_Color.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        body:    ['"DM Sans"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: #EEF2F3; }

        @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp   { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes countPop  { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
        @keyframes digitPop  { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,140,149,0.3); } 50% { box-shadow: 0 0 0 16px rgba(0,140,149,0); } }
        @keyframes scanLine  {
            0%   { top: 8%; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 92%; opacity: 0; }
        }
        .scan-line { animation: scanLine 2.2s ease-in-out infinite; }

        .camera-content-divider {
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0,140,149,0.15), rgba(0,140,149,0.3), rgba(0,140,149,0.15), transparent);
        }

        .keypad-key {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, background-color 0.12s ease;
        }
        .keypad-key:active { transform: scale(0.96); background-color: #E6F4F5; }

        .name-pick:hover  { border-color: #008C95 !important; background-color: #F4FBFC !important; }
        .name-pick:active { transform: scale(0.985); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // ============================================================
        // CONSTANTS
        // ============================================================
        const TEAL       = '#008C95';
        const TEAL_LIGHT = '#E6F4F5';
        const GOLD       = '#D69A2D';
        const SOUND_OPTIONS = [
            { value: 'error', label: 'error', path: '../sounds/error.mp3' },
            { value: 'final-success-chime-1', label: 'final-success-chime-1', path: '../sounds/final-success-chime-1.mp3' },
            { value: 'final-success-chime-2', label: 'final-success-chime-2', path: '../sounds/final-success-chime-2.mp3' },
            { value: 'final-success-chime-3', label: 'final-success-chime-3', path: '../sounds/final-success-chime-3.mp3' },
            { value: 'final-success-chime-4', label: 'final-success-chime-4', path: '../sounds/final-success-chime-4.mp3' },
            { value: 'successful-scan', label: 'successful-scan', path: '../sounds/successful-scan.m4a' },
        ];

        // Mock student database keyed by last-4 of campus card
        const MOCK_STUDENTS = {
            '1234': [{ name: 'Lillian Lyons',  cardEnd: '1234' }],
            '4010': [{ name: 'Marcus Thompson', cardEnd: '4010' }],
            '0000': [{ name: 'Test Student',   cardEnd: '0000' }],
            '8763': [
                { name: 'Megan Hartford', cardEnd: '8763' },
                { name: 'Nathan Wells',   cardEnd: '8763' },
            ],
            '5678': [
                { name: 'Aisha Patel',     cardEnd: '5678' },
                { name: 'Diego Rivera',    cardEnd: '5678' },
                { name: 'Sofia Nakamura',  cardEnd: '5678' },
            ],
        };

        // Mock Illumia order database keyed by 4-digit order number
        const MOCK_ORDERS = {
            '1001': { name: 'Marcus Thompson' },
            '2048': { name: 'Lillian Lyons'   },
            '3310': { name: 'Aisha Patel'     },
            '7777': { name: 'Sofia Nakamura'  },
        };

        // Senior-living streets (Address lookup). A unit is written the way an
        // address reads: number first, street second — e.g. "C137 Canyonview".
        // `prefix` is the street's unit-code letter (Garden Terrace has none).
        //
        // Garden Terrace is one street split into three wings (South/North/West),
        // and the wings reuse the same unit numbers — 101 exists in all three.
        // That's the ambiguity the two strategies below exist to resolve.
        const WING_NAMES = { S: 'South', N: 'North', W: 'West', E: 'East' };
        const BUILDINGS = [
            { name: 'Canyonview',     prefix: 'C', key: 'Canyonview'    },
            { name: 'Gardenview',     prefix: 'G', key: 'Gardenview'    },
            { name: 'Hillside',       prefix: 'H', key: 'Hillside'      },
            { name: 'Garden Terrace', prefix: '',  key: 'GardenTerrace', winged: true },
            { name: 'Villas',         prefix: 'V', key: 'Villas'        },
        ];

        // Live unit numbers per street, from the Glen's final account list (288
        // accounts). Garden Terrace units carry their wing letter: "101N".
        // ("Units" not "rooms" — in senior living these are often houses.)
        const BUILDING_UNITS = {
            Canyonview: ['137','138','139','140','142','143','145','146','150','151','153','154','155','156','157','158','160','161','162','238','239','241','242','243','244','246','250','251','252','254','255','257','258','259','260','261','262','337','339','340','341','344','345','346','347','348','350','351','352','353','354','356','357','358','361','362'],
            Gardenview: ['101','104','105','106','107','108','114','115','116','117','119','120','121','124','126','128','129','131','132','201','204','206','207','208','209','210','212','214','215','216','217','220','221','222','226','227','229','230','231','232','234','235','303','304','306','307','308','309','310','315','321','324','327','328','330','331','332','333','334','335'],
            Hillside: ['103','104','105','106','107','108','109','110','111','115','116','117','118','119','120','121','123','129','130','132','134','135','137','138','139','201','202','203','204','205','207','209','210','211','212','214','216','217','219','220','221','222','223','225','226','231','232','233','235','237','238','239','240','301','302','303','304','305','306','308','310','315','316','317','319','320','322','323','325','326','330','331','332','334','335','338','339','411','416','418','421','429','431','433','434','435','438','439','440'],
            Villas: ['101','102','104','107','108','110','111','112','114','115','117','118','119','122','124','125','126','127','128','129','130','131','132','133','134','135','136','137','141','142','143','144','145','146','147','149','151','152','153','156','159','160','161','162'],
            GardenTerrace: ['101S','103S','104S','107S','108S','202S','203S','205S','206S','208S','101N','102N','103N','104N','105N','106N','107N','108N','201N','202N','204N','205N','206N','208N','101W','102W','103W','104W','105W','107W','108W','201W','202W','203W','204W','205W','206W','207W','208W'],
        };

        // "101N" → number "101", wing "N". Typed input is parsed the same way,
        // so staff may type either "101" or "101N".
        const numericPart = (unit) => String(unit).match(/^\s*(\d+)/)?.[1] ?? '';
        const wingPart = (unit) => {
            const s = String(unit).trim().toUpperCase();
            return s.slice(numericPart(s).length);
        };

        // Letters offered on the alphanumeric keypad — derived from the data, so
        // the pad only ever shows wings that actually exist.
        const WING_LETTERS = Array.from(new Set(
            Object.values(BUILDING_UNITS).flat().map(wingPart).filter(Boolean)
        )).sort();

        const formatAddress = (building, unit) => {
            const num  = numericPart(unit);
            const wing = wingPart(unit);
            const wingLabel = wing ? ` ${WING_NAMES[wing] || wing}` : '';
            return `${building.prefix}${num}${wingLabel} ${building.name}`;
        };

        // Every registered unit in `building` matching what was typed.
        // A typed wing ("101N") matches exactly; a bare number ("101") matches
        // every wing, which is what surfaces the disambiguation picker.
        const resolveAddressMatches = (building, typed) => {
            const units = BUILDING_UNITS[building.key] || [];
            const num   = numericPart(typed);
            const wing  = wingPart(typed);
            return units
                .filter(u => wing ? (numericPart(u) === num && wingPart(u) === wing)
                                  : numericPart(u) === num)
                .map(u => ({ name: formatAddress(building, u), unit: u }));
        };

        // Streets that actually contain what was typed — powers the optional
        // "prefilter streets" behaviour in the address lookup.
        const buildingsWithUnit = (typed) =>
            BUILDINGS.filter(b => resolveAddressMatches(b, typed).length > 0);


        // Lookup modes, in display order.
        const MODE_META = [
            { value: 'orderId',  label: 'Order ID',   settingsLabel: 'Order ID' },
            { value: 'lastFour', label: 'Last 4',     settingsLabel: 'Account · Last 4' },
            { value: 'address',  label: 'Address',    settingsLabel: 'Address' },
            { value: 'qr',       label: 'USEFULL QR', settingsLabel: 'USEFULL QR' },
        ];

        // The three primary lookup modes are mutually exclusive — a venue runs one
        // of them. USEFULL QR is an add-on available alongside any of the three.
        const PRIMARY_MODES = [
            { value: 'orderId',  venue: 'Illumia',       sub: 'Order ID' },
            { value: 'lastFour', venue: 'Grubhub',       sub: 'Account · Last 4' },
            { value: 'address',  venue: 'Senior Living', sub: 'Address' },
        ];
        const isPrimaryMode = (v) => PRIMARY_MODES.some(m => m.value === v);

        // Demo test entries, shown contextually for whichever mode is selected.
        const MOCK_ADDRESSES = [
            { unit: '137',  key: 'Canyonview'    },
            { unit: '101',  key: 'GardenTerrace', note: 'ambiguous — 3 wings' },
            { unit: '101N', key: 'GardenTerrace', note: 'wing typed directly' },
            { unit: '103',  key: 'Hillside'      },
            { unit: '162',  key: 'Villas'        },
        ];
        const MOCK_ADDRESS_MISS = { unit: '999', key: 'Canyonview' };

        const DEFAULT_ENABLED_MODES = { orderId: true, lastFour: false, address: false, qr: false };
        const firstEnabledMode = (enabled) => (MODE_META.find(m => enabled[m.value]) || MODE_META[0]).value;
        const primaryOf = (enabled) => (PRIMARY_MODES.find(m => enabled[m.value]) || PRIMARY_MODES[0]).value;

        // Share-link config: the URL can preselect a mode via hash or query, e.g.
        //   /staffcheckout/#address              → open in Address mode (only)
        //   /staffcheckout/?mode=order           → open in Order ID mode
        //   /staffcheckout/?modes=order,qr       → Order ID with USEFULL QR enabled
        const MODE_ALIASES = {
            order: 'orderId', orderid: 'orderId', orderId: 'orderId', illumia: 'orderId',
            last4: 'lastFour', lastfour: 'lastFour', account: 'lastFour', card: 'lastFour', grubhub: 'lastFour',
            address: 'address', addr: 'address', senior: 'address', seniorliving: 'address',
            qr: 'qr', usefullqr: 'qr', usefull: 'qr',
        };
        const canonicalMode = (raw) => {
            if (!raw) return null;
            const k = String(raw).trim().toLowerCase();
            return MODE_ALIASES[k] || (MODE_META.some(m => m.value === raw) ? raw : null);
        };
        const parseModeConfig = () => {
            const params = new URLSearchParams(window.location.search);
            const active = canonicalMode(params.get('mode') || (window.location.hash || '').replace(/^#/, ''));
            const modesParam = params.get('modes');
            const enabled = { ...DEFAULT_ENABLED_MODES };
            let list = null;
            if (modesParam) list = modesParam.split(',').map(canonicalMode).filter(Boolean);
            else if (active) list = [active]; // a lone #mode means "just show this mode"
            if (list && list.length) {
                Object.keys(enabled).forEach(k => { enabled[k] = false; });
                // Only one primary can be on; extras in the URL are ignored.
                const primary = list.find(isPrimaryMode);
                enabled[primary || primaryOf(DEFAULT_ENABLED_MODES)] = true;
                if (list.includes('qr')) enabled.qr = true;
            }
            return {
                enabled,
                active: active && enabled[active] ? active : firstEnabledMode(enabled),
            };
        };

        // ============================================================
        // ICONS
        // ============================================================
        const IconX = ({ className, style, strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        );
        const IconCheck = ({ className, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                <path d="M20 6 9 17l-5-5"/>
            </svg>
        );
        const IconAlert = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
        );
        const IconExclamation = ({ className, style, color = GOLD }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className={className} style={style}>
                <rect x="10.2" y="3.2" width="3.6" height="13.2" rx="1.8" fill={color}/>
                <circle cx="12" cy="20" r="2.1" fill={color}/>
            </svg>
        );
        const IconSettings = ({ className, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                <circle cx="12" cy="12" r="3.3"/>
                <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.2 1.2 0 0 1 0 1.7l-1.6 1.6a1.2 1.2 0 0 1-1.7 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.2 1.2 0 0 1-1.2 1.2h-2.3A1.2 1.2 0 0 1 10 20v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.2 1.2 0 0 1-1.7 0l-1.6-1.6a1.2 1.2 0 0 1 0-1.7l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1.2 1.2 0 0 1-1.2-1.2v-2.3A1.2 1.2 0 0 1 4 9.4h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.2 1.2 0 0 1 0-1.7l1.6-1.6a1.2 1.2 0 0 1 1.7 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4A1.2 1.2 0 0 1 11.1 2.8h2.3A1.2 1.2 0 0 1 14.6 4v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1.2 1.2 0 0 1 1.7 0l1.6 1.6a1.2 1.2 0 0 1 0 1.7l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2A1.2 1.2 0 0 1 21.2 11v2.3a1.2 1.2 0 0 1-1.2 1.2h-.2a1 1 0 0 0-.9.6z"/>
            </svg>
        );
        const IconQR = ({ style, className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" style={style} className={className}>
                <rect x="2"  y="2"  width="9" height="9" rx="1.5" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <rect x="4.5" y="4.5" width="4" height="4"/>
                <rect x="13" y="2"  width="9" height="9" rx="1.5" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <rect x="15.5" y="4.5" width="4" height="4"/>
                <rect x="2"  y="13" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <rect x="4.5" y="15.5" width="4" height="4"/>
                <rect x="13" y="13" width="2.5" height="2.5"/>
                <rect x="17" y="13" width="2.5" height="2.5"/>
                <rect x="13" y="17" width="2.5" height="2.5"/>
                <rect x="17" y="17" width="2.5" height="2.5"/>
                <rect x="20" y="15" width="2" height="2"/>
                <rect x="15" y="20" width="2" height="2"/>
                <rect x="19" y="20" width="3" height="2"/>
            </svg>
        );
        const IconKeypad = ({ style, className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" style={style} className={className}>
                <rect x="3" y="3"  width="5" height="5" rx="1.2"/>
                <rect x="9.5" y="3"  width="5" height="5" rx="1.2"/>
                <rect x="16" y="3"  width="5" height="5" rx="1.2"/>
                <rect x="3" y="9.5" width="5" height="5" rx="1.2"/>
                <rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>
                <rect x="16" y="9.5" width="5" height="5" rx="1.2"/>
                <rect x="3" y="16" width="5" height="5" rx="1.2"/>
                <rect x="9.5" y="16" width="5" height="5" rx="1.2"/>
                <rect x="16" y="16" width="5" height="5" rx="1.2"/>
            </svg>
        );
        const IconBackspace = ({ style }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
                <path d="M21 5H9l-7 7 7 7h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
                <line x1="18" y1="9" x2="12" y2="15"/>
                <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
        );
        const IconArrowLeft = ({ style }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        );
        const IconCup = ({ style }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style={style}>
                <path d="M7 8h10l-.85 11.1A2 2 0 0 1 14.16 21H9.84a2 2 0 0 1-2-1.9L7 8z"/>
                <line x1="6" y1="8" x2="18" y2="8"/>
                <path d="M10 4.5c0-.55.45-1 1-1h2c.55 0 1 .45 1 1V8h-4V4.5z"/>
            </svg>
        );
        const IconHash = ({ style, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
                <line x1="4" y1="9"  x2="20" y2="9"/>
                <line x1="4" y1="15" x2="20" y2="15"/>
                <line x1="10" y1="3" x2="8"  y2="21"/>
                <line x1="16" y1="3" x2="14" y2="21"/>
            </svg>
        );
        const IconBuilding = ({ style, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>
                <path d="M3 21h18"/>
                <path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/>
                <path d="M15 21V9h3a1 1 0 0 1 1 1v11"/>
                <line x1="8" y1="8" x2="8" y2="8"/><line x1="11.5" y1="8" x2="11.5" y2="8"/>
                <line x1="8" y1="12" x2="8" y2="12"/><line x1="11.5" y1="12" x2="11.5" y2="12"/>
                <line x1="8" y1="16" x2="8" y2="16"/><line x1="11.5" y1="16" x2="11.5" y2="16"/>
            </svg>
        );
        const MODE_ICONS = {
            orderId:  IconHash,
            lastFour: IconKeypad,
            address:  IconBuilding,
            qr:       IconQR,
        };

        // ============================================================
        // USEFULL LOGO
        // ============================================================
        const UsefullLogo = ({ className, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 144" className={className} style={style}>
                <g>
                    <path fill="#008c95" d="M88.85,83.9c0,11.31-7.44,18.34-19.4,18.34s-19.4-7.03-19.4-18.34V46.13h-6.49v37.92c0,14.94,10.16,24.6,25.89,24.6s25.89-9.66,25.89-24.6V46.13h-6.49v37.77Z"/>
                    <path fill="#008c95" d="M141.57,73.67l-.29-.09c-10.6-3.34-17.04-5.84-17.04-12.37,0-6.19,5.89-10.04,15.37-10.04,10.06,0,16.82,4.22,16.82,10.5v1.38h6.41v-1.68c0-9.49-9.77-16.38-23.23-16.38s-22.09,6.64-22.09,16.53c0,11.6,12.64,15.48,21.87,18.31,10.7,3.24,17.72,5.87,17.72,12.6,0,6.19-6.12,10.04-15.98,10.04-10.56,0-17.65-4.22-17.65-10.5v-1.3h-6.41v1.61c0,9.64,9.9,16.38,24.07,16.38s22.77-6.46,22.77-16.45c0-11.74-12.91-15.66-22.34-18.53Z"/>

        // ============================================================
        // CAMERA BOX (shared with fullheight)
        // ============================================================
        const CameraBox = ({ isScanning, onQRResult, isPortrait, borderRadiusOverride }) => {
            const videoRef     = useRef(null);
            const containerRef = useRef(null);
            const canvasRef    = useRef(document.createElement('canvas'));
            const lastSeenRef  = useRef(null);
            const [cameraReady, setCameraReady] = useState(false);

            useEffect(() => {
                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }
                        });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            setCameraReady(true);
                        }
                    } catch (err) {
                        console.warn('Camera not available:', err.message);
                    }
                };
                startCamera();
                return () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            useEffect(() => {
                if (!isScanning || !onQRResult) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });

                const scan = () => {
                    const video     = videoRef.current;
                    const container = containerRef.current;
                    if (!video || !container || video.readyState < 2) return;

                    const cW = container.offsetWidth;
                    const cH = container.offsetHeight;
                    const vW = video.videoWidth;
                    const vH = video.videoHeight;
                    if (!vW || !vH) return;

                    const scale   = Math.max(cW / vW, cH / vH);
                    const offsetX = (cW - vW * scale) / 2;
                    const offsetY = (cH - vH * scale) / 2;

                    const cropX = Math.max(0, -offsetX / scale);
                    const cropY = Math.max(0, -offsetY / scale);
                    const cropW = Math.min(cW / scale, vW - cropX);
                    const cropH = Math.min(cH / scale, vH - cropY);

                    canvas.width  = Math.round(cropW);
                    canvas.height = Math.round(cropH);
                    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const result    = jsQR(imageData.data, canvas.width, canvas.height);

                    if (result) {
                        let decoded = result.data;
                        try { decoded = atob(result.data); } catch (_) {}
                        if (decoded === lastSeenRef.current) return;
                        lastSeenRef.current = decoded;
                        onQRResult(decoded);
                    }
                };

                const interval = setInterval(scan, 200);
                return () => clearInterval(interval);
            }, [isScanning, onQRResult]);

            const borderRadius = borderRadiusOverride !== undefined
                ? borderRadiusOverride
                : (isPortrait ? '0 0 24px 24px' : '16px');

            return (
                <div
                    ref={containerRef}
                    className="w-full h-full relative overflow-hidden"
                    style={{ backgroundColor: '#111', borderRadius }}
                >
                    <video
                        ref={videoRef}
                        autoPlay playsInline muted
                        className="absolute inset-0 w-full h-full object-cover"
                        style={{ transform: 'scaleX(-1)' }}
                    />

                    {isPortrait && (
                        <div className="absolute bottom-0 left-0 right-0 pointer-events-none"

                            </div>
                        </div>

                    {[

                        { top: 16, right: 16,  borderTop:    `6px solid ${TEAL}`, borderRight:  `6px solid ${TEAL}`, borderRadius: '0 6px 0 0' },
                        { bottom: 16, left: 16,  borderBottom: `6px solid ${TEAL}`, borderLeft:   `6px solid ${TEAL}`, borderRadius: '0 0 0 6px' },
                        { bottom: 16, right: 16, borderBottom: `6px solid ${TEAL}`, borderRight:  `6px solid ${TEAL}`, borderRadius: '0 0 6px 0' },

        const NumericKeypad = ({ onDigit, onBackspace, disabled, onSubmit, submitLabel, submitDisabled, letters }) => {

        const CircularCancelButton = ({ timeLeft, total = 60, onCancel }) => {
            const radius = 13;
            const circumference = 2 * Math.PI * radius;
            const fraction = Math.max(0, Math.min(1, timeLeft / total));
            const offset = circumference * (1 - fraction);
            const isLow = timeLeft <= 10;
            const stroke = isLow ? '#ef4444' : '#6b7280';

            return (
                <button
                    onClick={onCancel}
                    className="flex items-center gap-3 rounded-xl transition-all"
                    style={{
                        padding: '10px 18px 10px 12px',
                        border: `1.5px solid ${isLow ? '#fca5a5' : '#e5e7eb'}`,
                        backgroundColor: isLow ? '#FEF2F2' : 'white',
                        cursor: 'pointer',
                        transition: 'border-color 0.3s, background-color 0.3s',
                    }}
                >
                    <svg viewBox="0 0 32 32" style={{ width: 26, height: 26, flexShrink: 0 }}>
                        <circle cx="16" cy="16" r={radius} fill="none"
                                stroke={isLow ? '#fee2e2' : '#e5e7eb'} strokeWidth="3" />
                        <circle cx="16" cy="16" r={radius} fill="none"
                                stroke={stroke} strokeWidth="3" strokeLinecap="round"
                                strokeDasharray={circumference}
                                strokeDashoffset={offset}
                                transform="rotate(-90 16 16)"
                                style={{ transition: 'stroke-dashoffset 1s linear, stroke 0.3s' }} />
                    </svg>
                    <span className="font-display font-bold uppercase tracking-wider"
                          style={{ fontSize: '1rem', color: isLow ? '#ef4444' : '#6b7280' }}>
                        Cancel

                </button>
            );

        // ============================================================
        // ACCESS CODE MODAL (shared)
        // ============================================================
        const AccessCodeModal = ({ isOpen, onClose }) => {
            const [code, setCode] = React.useState('');
            const [showCode, setShowCode] = React.useState(false);
            const inputRef = React.useRef(null);

            React.useEffect(() => {
                if (isOpen) { setCode(''); setTimeout(() => inputRef.current?.focus(), 100); }
            }, [isOpen]);

            if (!isOpen) return null;

            const handleChange = (e) => {
                const val = e.target.value.replace(/\D/g, '').slice(0, 4);
                setCode(val);
            };

            return (
                <div className="absolute inset-0 z-50 flex items-center justify-center"
                     style={{ backgroundColor: 'rgba(0,0,0,0.45)', backdropFilter: 'blur(8px)',
                              WebkitBackdropFilter: 'blur(8px)', animation: 'fadeIn 0.2s ease-out' }}
                     onClick={onClose}>
                    <div className="bg-white rounded-3xl shadow-2xl w-full mx-6 overflow-hidden"
                         style={{ animation: 'scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)', maxWidth: 420 }}
                         onClick={e => e.stopPropagation()}>
                        <div style={{ padding: '28px 28px 20px' }}>
                            <h2 className="font-display font-extrabold text-center"
                                style={{ color: '#1e293b', fontSize: '1.2rem', lineHeight: 1.3 }}>

                                    ref={inputRef}
                                    type={showCode ? 'text' : 'password'}
                                    inputMode="numeric"
                                    pattern="[0-9]*"
                                    maxLength={4}
                                    value={code}
                                    onChange={handleChange}
                                    placeholder="Enter code here"
                                    className="w-full font-body"
                                    style={{
                                        padding: '14px 48px 14px 16px',
                                        border: `1.5px solid ${code.length === 4 ? TEAL : '#e2e8f0'}`,
                                        borderRadius: 12,
                                        fontSize: '1.1rem',
                                        outline: 'none',
                                        letterSpacing: code.length && !showCode ? '0.4em' : 'normal',
                                        transition: 'border-color 0.2s',
                                    }}
                                />
                                <button
                                    onClick={() => setShowCode(v => !v)}
                                    style={{ position: 'absolute', right: 14, top: '50%',
                                             transform: 'translateY(-50%)', background: 'none',
                                             border: 'none', cursor: 'pointer', padding: 4, color: '#94a3b8' }}

                                    {showCode ? (
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ width: 20, height: 20 }}>
                                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                                        </svg>
                                    ) : (
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ width: 20, height: 20 }}>
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                        </svg>
                                    )}
                                </button>
                            </div>
                        </div>

        const DemoBar = ({
            enabledModes, onSetPrimary, onToggleQr,

            onSimulateScan, scanEnabled,

            const primary = primaryOf(enabledModes);

            const Chip = ({ onClick, children, tone = 'default', title }) => {
                const tones = {
                    default: { border: '#3f4b5b', bg: '#2b3543', color: '#e2e8f0' },
                    miss:    { border: '#7f3b3b', bg: '#3a2626', color: '#fca5a5' },

                const t = tones[tone];
                return (
                    <button
                        type="button" onClick={onClick} title={title}
                        className="font-body"
                        style={{
                            padding: '6px 11px', borderRadius: 7, fontSize: '0.82rem',
                            border: `1px solid ${t.border}`, backgroundColor: t.bg,
                            color: t.color, cursor: 'pointer', whiteSpace: 'nowrap',
                        }}
                    >
                        {children}
                    </button>
                );
            };

            const Switch = ({ on }) => (
                <span style={{
                    width: 32, height: 18, borderRadius: 999, flexShrink: 0,
                    backgroundColor: on ? TEAL : '#4b5563',
                    position: 'relative', transition: 'background-color 0.2s',
                }}>
                    <span style={{
                        position: 'absolute', top: 2, left: on ? 16 : 2,
                        width: 14, height: 14, borderRadius: '50%', backgroundColor: '#fff',
                        transition: 'left 0.2s', boxShadow: '0 1px 3px rgba(0,0,0,0.35)',
                    }} />
                </span>
            );

            const Label = ({ children }) => (
                <span className="font-display font-bold uppercase"
                      style={{ color: '#64748b', fontSize: '0.62rem', letterSpacing: '0.12em' }}>
                    {children}
                </span>

            return (
                <div style={{
                    backgroundColor: '#1b2330',
                    borderBottom: '2px solid #0f1620',
                    padding: '8px 14px',
                    display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 14,
                    fontFamily: "'DM Sans', sans-serif",
                }}>
                    <span className="font-display font-bold uppercase"
                          style={{ color: '#f59e0b', fontSize: '0.62rem', letterSpacing: '0.16em' }}>

                                const active = primary === m.value;

                                    <button
                                        key={m.value} type="button"
                                        onClick={() => onSetPrimary(m.value)}
                                        className="font-display font-bold"
                                        style={{

                                            padding: '5px 11px', borderRadius: 6, border: 'none',
                                            backgroundColor: active ? TEAL : 'transparent',
                                            color: active ? '#fff' : '#94a3b8',
                                            cursor: 'pointer', lineHeight: 1.15, textAlign: 'left',
